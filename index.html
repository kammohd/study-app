async function api(path, opts) {
  const { data } = await sb.auth.getSession();
  const t = data.session && data.session.access_token;
  if (!t) throw new Error("Signed out");
  const r = await fetch(API + path, { ...opts, headers: { authorization: "Bearer " + t, "content-type": "application/json" } });
  if (!r.ok) { const d = (await r.json().catch(() => ({}))).detail; throw new Error(typeof d === "string" ? d : "Error " + r.status); }
  return r.json();
}

// First load of a topic can fail once (cold server, or a batch that did not pass verification); try again quietly.
// A 200 reply can still carry {error} (nothing usable was written); count that as a failure worth one retry.
async function aiPost(path, body) {
  const go = async () => { const d = await api(path, { method: "POST", body: JSON.stringify(body) }); if (d.error) throw new Error(d.error); return d; };
  try { return await go(); }
  catch (e) { await new Promise(r => setTimeout(r, 1500)); return go(); }
}

async function flushCloud() {
  const ids = Object.keys(cq);
  if (!me || !ids.length) return;
  for (let i = 0; i < ids.length; i += 200) {
    const chunk = ids.slice(i, i + 200), sent = chunk.map(id => [id, cq[id]]);
    await api("/ticks", { method: "POST", body: JSON.stringify(sent.map(([id, v]) => ({ id, done_on: v || null }))) });

    saveCq();

}

// Cloud is the source of truth once this device has uploaded its own progress (offered once per account).
async function cloudSync() {
  if (!me) return;
  try {
    const initKey = "cloudInit_" + me.id;
    const [cloud, goalsCloud] = await Promise.all([api("/ticks"), api("/goals")]);
    if (!localStorage.getItem(initKey)) {
      const mine = Object.keys(state).filter(k => isDate(state[k]) && !(k in cloud));
      if (mine.length && confirm("Upload the " + mine.length + " items of progress on this device to your account?")) {
        mine.forEach(k => { cq[k] = state[k]; }); saveCq();
      }
      Object.keys(goals).forEach(k => { if (!(k in goalsCloud)) goalsCloud[k] = goals[k]; });
      if (Object.keys(goalsCloud).length) await api("/goals", { method: "PUT", body: JSON.stringify(goalsCloud) });
      localStorage.setItem(initKey, "1");
    }
    await flushCloud();
    if (!Object.keys(cq).length) {
      const fresh = await api("/ticks");
      Object.keys(state).forEach(k => { if (!(k in fresh) && isDate(state[k])) delete state[k]; });
      Object.entries(fresh).forEach(([k, v]) => { state[k] = v; });
      save();
    }
    goals = { ...goals, ...goalsCloud }; try { localStorage.setItem("goals", JSON.stringify(goals)); } catch (e) {}
    cloudMsg = ""; setDot("ok", "cloud synced");
    if (me.is_admin) await adminLoad(true);
  } catch (e) { cloudMsg = "Sync failed: " + e.message; setDot("err", "sync failed"); }
}

// Local calendar date (YYYY-MM-DD) — never toISOString(), which is UTC and
// stamps late-night ticks (before 4am in the UAE) with yesterday's date.
function localDate(d) {
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function curWeek() { const d = Math.floor((Date.now() - START) / 864e5); return Math.min(16, Math.max(1, Math.floor(d / 7) + 1)); }

function todayInfo() {
  const now = new Date();
  const d = Math.floor((now - START) / 864e5);
  if (d < 0) return { pre: true };
  const week = Math.floor(d / 7) + 1;
  const dow = (now.getDay() === 0) ? 7 : now.getDay();
  if (week > 16) return { done: true };
  if (dow === 7) return { rest: true, week };
  return { week, dow, task: W[week-1].ts[dow-1], phone: W[week-1].ph[dow-1] === "p", id: "w" + week + "t" + (dow-1) };
}

// Your actual learning position: the first undone lesson in the plan.
// The Today tab follows THIS, not the calendar.
function position() {
  for (let w = 1; w <= 16; w++) {
    for (let d = 1; d <= 6; d++) {
      const id = "w" + w + "t" + (d - 1);
      if (!state[id]) return { week: w, dow: d, task: W[w-1].ts[d-1], phone: W[w-1].ph[d-1] === "p", id: id };
    }
  }
  return null; // everything ticked
}

// How many study sessions (Mon–Sat) the calendar expects by today.
function expectedSessions() {
  const d = Math.floor((new Date() - START) / 864e5);
  if (d < 0) return 0;
  let n = 0;
  for (let i = 0; i <= Math.min(d, 111); i++) {
    if (new Date(START.getTime() + i * 864e5).getDay() !== 0) n++;
  }
  return Math.min(n, 96);
}

function setDot(cls, lbl) { const d = document.getElementById("syncDot"); d.className = "dot " + cls; document.getElementById("syncLbl").textContent = lbl; }

async function pull() {
  if (!cfg()) { setDot("", "local only"); return; }
  try {
    const r = await fetch(cfg() + "?t=" + Date.now());
    const remote = await r.json();
    Object.entries(remote).forEach(([k, v]) => { if (v && !(k in queue)) state[k] = v; });
    // delete-cleanup applies to real task ids only — video (wNvD) and exercise (wNeI)
    // marks are local-first and must never be wiped by a backend that doesn't store them
    Object.keys(state).forEach(k => { if (/^w\d+t\d+$/.test(k) && !(k in remote) && !(k in queue)) delete state[k]; });
    save(); setDot("ok", "synced"); flushQueue();
  } catch(e) { setDot("err", "sync failed"); }
}

}
async function flushQueue() {

  const batch = { ...queue };
  try {

    Object.keys(batch).forEach(k => delete queue[k]);

function stats() {
  const total = 96, done = Object.keys(state).filter(k => /^w\d+t\d+$/.test(k)).length;
  const dates = new Set(Object.values(state)); let streak = 0; const d = new Date();
  if (!dates.has(localDate(d))) d.setDate(d.getDate()-1);
  while (dates.has(localDate(d))) { streak++; d.setDate(d.getDate()-1); }
  return { done, total, pct: Math.round(done/total*100), streak };
}

function pickVid(wk, prefDay) {
  const list = YT[wk] || [];
  if (!list.length) return 0;
  const order = [];
  if (prefDay >= 1 && prefDay <= list.length) order.push(prefDay);
  for (let d = 1; d <= list.length; d++) if (d !== prefDay) order.push(d);
  for (const d of order) if (list[d-1] && !vidWatched(wk, d)) return d;
  return -1; // all watched
}

// ---- Practice (in-app Python via Pyodide) ----
let pyodide = null, pyLoading = null, exBusy = false;

function ensurePy() {
  if (pyodide) return Promise.resolve(pyodide);
  if (!pyLoading) {
    pyLoading = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
      s.onload = res;
      s.onerror = () => rej(new Error("couldn't download Python — check your connection"));
      document.head.appendChild(s);
    }).then(() => loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" }))
      .then(p => { pyodide = p; return p; })
      .catch(e => { pyLoading = null; throw e; });
  }
  return pyLoading;
}

const RUN_PY = `
import sys, io, traceback
_buf = io.StringIO()
_old = sys.stdout
sys.stdout = _buf
try:
    exec(_user_code, {})
except Exception:
    traceback.print_exc(file=_buf)
sys.stdout = _old
_buf.getvalue()
`;

const CHECK_PY = `
import sys, io, traceback, json as _json
_buf = io.StringIO()
_old = sys.stdout
sys.stdout = _buf
_ns = {}
_ok = False
_msg = ""
try:
    exec(_user_code, _ns)
    exec(_test_code, _ns)
    _ok = True
except AssertionError as _e:
    _msg = str(_e) or "one of the checks failed"
except Exception:
    _msg = traceback.format_exc().strip().split(chr(10))[-1]
sys.stdout = _old
_json.dumps({"ok": _ok, "msg": _msg, "out": _buf.getvalue()})
`;

function exSolved(wk, i) {
  const ex = (EX[wk] || [])[i];
  if (ex && ex.ai) return !!ex.done;        // AI extras are session-scoped
  return !!state["w" + wk + "e" + i];
}

async function runEx(wk, i, mode) {
  if (exBusy) return;
  const ta = document.getElementById("pyed_" + wk + "_" + i);
  const out = document.getElementById("pyout_" + wk + "_" + i);
  if (!ta || !out) return;
  exBusy = true;
  out.style.display = "block";
  try {
    if (!pyodide) out.textContent = "⏳ Loading Python (~10 MB the first time, instant after)…";
    const py = await ensurePy();
    py.globals.set("_user_code", ta.value);
    if (mode === "run") {
      out.textContent = "▶ running…";
      const res = await py.runPythonAsync(RUN_PY);
      out.textContent = (res && res.trim()) ? res.slice(0, 2000) : "(no output — add a print())";
    } else {
      py.globals.set("_test_code", EX[wk][i].test);
      out.textContent = "🧪 checking…";
      const res = JSON.parse(await py.runPythonAsync(CHECK_PY));
      track(EX[wk][i].ai ? "challenge" : "exercise", EX[wk][i].t, !!res.ok, wk);
      if (res.ok) {
        out.textContent = (res.out ? res.out.slice(0, 800) + "\n" : "") + "✅ All checks passed!";
        markSolved(wk, i);
      } else {
        out.textContent = ((res.out ? res.out.slice(0, 800) + "\n" : "") + "❌ " + res.msg).slice(0, 2000);
      }
    }
  } catch (e) { out.textContent = "⚠️ " + e.message; }
  exBusy = false;
}

function pyTab(e) {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "    " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 4;
  }
}

function markSolved(wk, i) {
  const ex = (EX[wk] || [])[i];
  if (ex && ex.ai) {
    if (!ex.done) {
      ex.done = 1;
      localStorage.setItem("aiSolved", (parseInt(localStorage.getItem("aiSolved")) || 0) + 1);
      // mark solved in the challenge bank (never served again) + save my code
      if (aiOn() && ex.cid) api("/challenge/solved", { method: "POST", body: JSON.stringify({ challenge_id: ex.cid, code: ((document.getElementById("pyed_" + wk + "_" + i) || {}).value || "").slice(0, 2000) }) }).catch(() => {});
    }
  } else {
    const id = "w" + wk + "e" + i;
    if (!state[id]) { const dt = localDate(); state[id] = dt; push(id, dt); save(); }
  }
  const st = document.getElementById("pyst_" + wk + "_" + i);
  if (st) { st.textContent = "✓ solved"; st.className = "expass"; }
}

// ✨ Endless AI challenges — same idea as the AI quiz, but for code.
// Backend generates {title, brief, scaffold, test, solution}; before showing it,
// the reference solution is run against the tests in Pyodide — a broken
// generation is discarded and re-requested. Never trust ungraded generation.
let chBusy = false;
async function newChallenge(wk, btn) {
  if (chBusy) return;
  if (!aiOn()) { if (btn) btn.textContent = "Sign in first (Me tab)"; return; }
  chBusy = true;
  const orig = btn ? btn.textContent : "";
  try {
    if (btn) btn.textContent = "⏳ Loading Python…";
    const py = await ensurePy();
    for (let attempt = 0; attempt < 2; attempt++) {
      if (btn) btn.textContent = "✨ Writing you a challenge…";
      const tp = wk > 16 ? topicByKey(wk) : null;   // 101+ / 201+ are track topics, 1-16 are plan weeks
      const doneTasks = tp ? [] : W[wk-1].ts.filter((_, i) => state["w" + wk + "t" + i]);
      const avoid = (EX[wk] || []).map(e => e.t);
      const key = tp ? String(tp.id) : "w" + wk;
      const d = await aiPost("/challenge/next", {
        track: tp ? trackOf(tp) : "py", key: key, avoid: avoid.slice(-60), theme: tp ? tp.title : W[wk-1].th,
        week: tp ? null : wk, recent: doneTasks.join("; ").slice(0, 1400), source: tp ? String(tp.focus || "").slice(0, 2000) : "" });
      if (d.key !== key) throw new Error("backend");
      if (!d.scaffold || !d.test || !d.solution) throw new Error(d.error ? String(d.error).slice(0, 60) : "backend");
      py.globals.set("_user_code", d.solution);
      py.globals.set("_test_code", d.test);
      const chk = JSON.parse(await py.runPythonAsync(CHECK_PY));
      if (!chk.ok) {
        // broken exercise — every generated challenge is banked, so retire it for everyone
        api("/challenge/bad", { method: "POST", body: JSON.stringify({ challenge_id: d.id }) }).catch(() => {});
        continue;
      }
      EX[wk].push({ t: d.title || "AI challenge", q: d.brief || "Solve it so the checks pass.", c: d.scaffold, test: d.test, ai: 1, cid: d.id });
      chBusy = false;
      render();
      openEx(wk, EX[wk].length - 1);
      return;
    }
    throw new Error("got two broken generations — try again");
  } catch (e) {
    if (btn) { btn.textContent = (e.message === "backend") ? "⚠️ Got the wrong challenge back — try again" : "⚠️ " + e.message; setTimeout(() => { btn.textContent = orig; }, 4000); }
  }
  chBusy = false;
}

// Today = what's due this week across every track with a goal, then a way out to anything else.
function dueCard(id) {
  const g = goalOf(id), n = weekDone(id), met = g > 0 && n >= g, name = esc(TR[id].name);
  if (id === "py") {
    const pos = position();
    if (!pos) return `<div class="card"><div class="muted">${name}</div><h2>All 96 lessons ticked 🎉</h2></div>`;

      <h2>${esc(pos.task)}</h2><ol class="route" aria-label="This week's lessons">${route}</ol>

// Plan = this week across tracks: goals you can change, what's next in each track, and last week's result.
function rPlan() {
  const ids = Object.keys(TR);
  const goalsCard = `<div class="card"><h2>Weekly goals</h2><p class="muted">Week of ${weekStart(0)} · resets every Monday, so a missed week never piles up.</p>
    ${ids.map(id => { const g = goalOf(id), n = weekDone(id);
      return `<div class="goalrow"><div><b>${esc(TR[id].name)}</b><div class="muted">${n} of ${g} ${unitOf(id)} this week · last week ${lastWeekDone(id)}</div>${goalBar(n, g)}</div>
        <div class="step"><button aria-label="fewer" onclick="setGoal('${id}',-1)">−</button><b>${g}</b><button aria-label="more" onclick="setGoal('${id}',1)">+</button></div></div>`; }).join("")}</div>`;
  const next = ids.filter(id => goalOf(id) > 0).map(id => {
    const left = Math.max(1, goalOf(id) - weekDone(id)), L = TR[id].topics.filter(tp => !tDone(tp));
    const rows = id === "py"
      ? (() => { const out = []; for (let w = 1; w <= 16 && out.length < left; w++) W[w - 1].ts.forEach((t, i) => { const k = "w" + w + "t" + i; if (!state[k] && out.length < left) out.push(`<div class="taskline"><div class="tick" onclick="toggle('${k}')"></div><div class="txt" onclick="openTopic(${w})">W${w} D${i + 1}: ${esc(t)}</div></div>`); }); return out.join(""); })()

    return rows ? `<div class="phasehd">${esc(TR[id].name)} · up next</div>${rows}` : "";

  return goalsCard + next + review;
}

  <div class="card"><h2>Google Sheets sync</h2>
    <p class="muted">Your Apps Script web-app URL (ends in /exec).</p>
    <input type="url" id="urlIn" placeholder="https://script.google.com/macros/s/…/exec" value="${cfg()}">
    <button class="btn primary undone" onclick="localStorage.setItem('sheetUrl', document.getElementById('urlIn').value.trim()); pull().then(render)">Save & test connection</button>
    <button class="btn ghost" onclick="pull().then(render)">↻ Sync now</button>
  </div>
  <div class="card"><h2>Notifications</h2>
    <p class="muted">Status: <b>${perm}</b>. Needs the app installed to your home screen (iOS 16.4+). Paste the VAPID public key, then enable.</p>
    <input type="text" id="vapidIn" placeholder="VAPID public key (starts with B…)" value="${localStorage.getItem('vapidKey') || ''}">
    <button class="btn primary undone" onclick="localStorage.setItem('vapidKey', document.getElementById('vapidIn').value.trim()); enablePush()">🔔 Enable notifications</button>
    <p class="muted" id="pushStatus"></p>
  </div>
  <div class="card"><h2>Data</h2>
    <p class="muted">Progress: ${stats().done}/96 · pending sync: ${Object.keys(queue).length} · app v12</p>
    <button class="btn ghost" onclick="navigator.clipboard.writeText(JSON.stringify(state)); this.textContent='Copied ✓'">Export progress (copy JSON)</button>
  </div>
  <div class="card"><h2>Install as app</h2>
    <p class="muted"><b>iPhone:</b> Safari → Share → Add to Home Screen.<br><b>Android:</b> Chrome → menu ⋮ → Add to Home screen.</p>
  </div>`;
}

async function enablePush() {
  const st = document.getElementById("pushStatus");
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      st.textContent = "Push not supported here. On iPhone: install to home screen first, then enable from inside the installed app.";
      return;
    }
    const vk = localStorage.getItem("vapidKey") || "";
    if (!vk) { st.textContent = "Paste the VAPID public key first."; return; }
    const reg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { st.textContent = "Permission not granted."; return; }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(vk) });
    await fetch(cfg(), { method: "POST", body: JSON.stringify({ subscribe: sub.toJSON() }) });
    st.textContent = "Notifications enabled on this device ✓";
  } catch (err) { st.textContent = "Error: " + err.message; }
}

function urlB64(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const b = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function copyCode(w, btn) {
  navigator.clipboard.writeText(W[w].code).then(() => { btn.textContent = "Copied ✓ — paste in Colab"; });
}

function go(t) {
  tab = t; curTopic = 0; stack = []; render(); window.scrollTo(0, 0);
}

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }

async function refresh() {
  if (Object.keys(queue).length) { flushQueue(); return; }
  const before = JSON.stringify(state);
  await pull();
  if (JSON.stringify(state) !== before && tab !== "lib" && !curTopic && !document.querySelector(".vframe") && !document.querySelector(".pybox")) render();
}

if (authErr) tab = "me";
render();
if (sb) sb.auth.onAuthStateChange((ev, session) => {
  // Not async inside the callback: calling Supabase from in here can deadlock, so hop out first.
  if (ev === "SIGNED_OUT") { me = null; setTimeout(render, 0); }
  else if (session && (ev === "INITIAL_SESSION" || ev === "SIGNED_IN")) {
    setTimeout(async () => {
      try { me = await api("/me"); } catch (e) { me = null; cloudMsg = "Could not reach the server: " + e.message; }
      await cloudSync(); render();
    }, 0);
  }
});
loadTracks().then(render);
pull().then(render);
setInterval(refresh, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
